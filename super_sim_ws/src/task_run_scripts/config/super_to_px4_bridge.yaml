# bridge_controller_params.yaml

# 基本控制参数
timeout_threshold: 0.5
max_velocity_xy: 1.2
max_velocity_z: 1.0
max_yaw_rate: 1.5
max_yaw_angle_rate: 0.5
position_control_gain: 1.0
max_position_error: 0.5
super_cmd_topic: "/planning/pos_cmd"
use_current_yaw: true
use_yaw_angle_control: true

# 速度/加速度前馈（室外抗风关键参数）
# 纯位置控制 → 跟踪滞后 → 室外炸机
# 位置+速度前馈 → PX4提前知道方向 → 跟踪紧密
# 位置+速度+加速度前馈 → 弯道跟踪更好 → 适合室外
use_velocity_ff: false         # 禁用速度前馈(排查左右摇摆: 前馈可能引入抖动)
use_accel_ff: false           # 禁用加速度前馈(排查左右摇摆: 低通0.5可能滞后振荡)
velocity_ff_gain: 0.7          # 0.5~1.0，室外建议0.6~0.8，过大会引入抖动

# ======================== 起飞后扫描参数 (2026-08-19 新增) ========================
# 起飞悬停后先原地转 ±scan_angle_deg 扫描建图, 把障碍物周围未知区变已知,
# 再进入主循环。解决 frontend_in_known_free=true 时"右侧有路却贴着障碍走"。
scan_after_takeoff_en: false    # 是否在起飞后执行扫描阶段
scan_angle_deg: 90             # 扫描角度(度): 90=转±90°覆盖左右, 120/180可扫更大范围
scan_hold_time: 1.0            # 每个扫描方向保持时间(秒), 让雷达充分扫过
scan_yaw_rate: 0.0873          # 扫描偏航角速度(rad/s) 0.0873=5°/s, 90°转18s(用户选定: 5°/s最稳)
# ==============================================================================

# 起飞高度
init_goal:
  x: 0.0
  y: 0.0
  z: 0.6

# 自动解锁/模式切换
auto_arm: false
auto_offboard: false

# 降落参数
land_speed: 0.3
land_height: 0.15
auto_disarm: true

# 故障安全
failsafe_en: true
battery_threshold: 20.0
rc_loss_timeout: 1.0
geofence_en: false
geofence:
  x_min: -10.0
  x_max: 10.0
  y_min: -10.0
  y_max: 10.0
  z_min: 0.0
  z_max: 5.0
