# bridge_controller_params.yaml

# 基本控制参数
timeout_threshold: 0.5
max_velocity_xy: 1.2
max_velocity_z: 1.0
max_yaw_rate: 1.5
max_yaw_angle_rate: 0.5
position_control_gain: 1.0
max_position_error: 0.5
super_cmd_topic: "/planning/pos_cmd"
use_current_yaw: true
use_yaw_angle_control: true

# 速度/加速度前馈（室外抗风关键参数）
# 纯位置控制 → 跟踪滞后 → 室外炸机
# 位置+速度前馈 → PX4提前知道方向 → 跟踪紧密
# 位置+速度+加速度前馈 → 弯道跟踪更好 → 适合室外
use_velocity_ff: true
use_accel_ff: true
velocity_ff_gain: 0.7          # 0.5~1.0，室外建议0.6~0.8，过大会引入抖动

# 起飞高度
init_goal:
  x: 0.0
  y: 0.0
  z: 1.2

# 自动解锁/模式切换
auto_arm: false
auto_offboard: false

# 降落参数
land_speed: 0.3
land_height: 0.15
auto_disarm: true

# 故障安全
failsafe_en: true
battery_threshold: 20.0
rc_loss_timeout: 1.0
geofence_en: false
geofence:
  x_min: -10.0
  x_max: 10.0
  y_min: -10.0
  y_max: 10.0
  z_min: 0.0
  z_max: 5.0
